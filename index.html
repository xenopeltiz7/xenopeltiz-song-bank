<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xenopeltiz Song Bank</title>
<style>
:root{
  --bg:#0d1014;--panel:#151a20;--panel2:#1b2129;--line:#2b333d;
  --text:#f4f6f8;--muted:#8e99a6;--red:#e51d2a;--orange:#ff6900;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Segoe UI,sans-serif;overflow-x:hidden}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{height:100vh;position:sticky;top:0;background:#101419;border-right:1px solid var(--line);padding:18px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;margin:2px 4px 20px}
.logo img{width:48px;height:48px;object-fit:contain}
.logo b{font-size:15px}.logo small{display:block;color:var(--muted);margin-top:3px;font-size:10px}
.add{width:100%;border:0;border-radius:10px;padding:12px;color:white;font-weight:bold;background:linear-gradient(135deg,var(--red),var(--orange));cursor:pointer}
.search{width:100%;margin:12px 0;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);outline:none}
.album{margin:20px 0 7px 5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.song{padding:10px;border-radius:8px;border:1px solid transparent;cursor:pointer;margin:3px 0}
.song:hover{background:var(--panel2)}.song.active{background:#222932;border-color:#3a434e}
.song b{display:block;font-size:13px}.song small{color:var(--muted);font-size:10px}
main{min-width:0}.bar{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 25px;position:sticky;top:0;background:rgba(13,16,20,.92);backdrop-filter:blur(12px);z-index:5}
.btn{padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.btn.red{background:var(--red);border-color:var(--red);color:white}
.content{max-width:950px;margin:auto;padding:30px}
h1{font-size:32px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:18px}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.cardhead h2{font-size:14px;margin:0}
.fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}
label{font-size:10px;color:var(--muted);display:block;margin-bottom:5px}
input,textarea{width:100%;background:#10151a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;outline:none}
.rows{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 35px;gap:6px;align-items:center}
.num{color:var(--muted);text-align:center;font-size:10px}
.row input{font-family:Consolas,monospace;min-width:0}
.del{width:35px;height:38px;padding:0}
.preview{font-family:Consolas,monospace;font-size:19px}
.lyric{border-bottom:1px solid #252c34;padding:9px 0 12px}
.chord{color:#ff7647;font-weight:bold;min-height:22px;white-space:pre;font-family:Consolas,monospace}.words{min-height:22px;white-space:pre;font-family:Consolas,monospace}.chord-segments{display:flex;align-items:flex-end;flex-wrap:wrap}.chord-segment{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:top;white-space:pre}.chord-segment .chord{width:100%;min-height:22px}.chord-segment .words{width:100%}
.record{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{color:var(--muted);font-size:11px}
.rec{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;background:#10151a;border:1px solid var(--line);border-radius:9px;margin-top:8px}
.rec small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
audio{width:min(380px,100%)}.format-help{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.6;padding:10px 12px;background:#10151a;border:1px solid var(--line);border-radius:8px}.format-help b{color:#ff7647}.line-input{font-family:Consolas,monospace}.empty{color:var(--muted);font-size:12px;padding:10px 3px}
.toast{position:fixed;right:18px;bottom:18px;background:#111820;border:1px solid var(--line);padding:10px 14px;border-radius:9px;opacity:0;transition:.2s}.toast.on{opacity:1}
@media(max-width:750px){.app{grid-template-columns:1fr}aside{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.content{padding:18px}.fields{grid-template-columns:1fr}.row{grid-template-columns:22px minmax(0,1fr) 35px}.bar{padding:0 12px}}

.song-window{font-family:Consolas,"Courier New",monospace;background:#fff;color:#111;min-height:100vh;padding:42px 55px}
.song-window h1{font-family:Arial,Segoe UI,sans-serif;font-size:28px;margin:0 0 5px;color:#111}
.song-window .song-meta{font-family:Arial,Segoe UI,sans-serif;color:#666;font-size:12px;margin-bottom:28px}
.song-window .song-line{border-bottom:1px solid #ddd;padding:12px 0 15px;white-space:pre-wrap;break-inside:avoid}
.song-window .song-chord{color:#d9471d;font-weight:700;white-space:pre;min-height:21px}
.song-window .song-lyric{color:#111;white-space:pre;min-height:21px}
.song-window .song-controls{position:fixed;right:18px;bottom:18px;display:flex;gap:7px}
.song-window .song-controls button{border:0;border-radius:20px;background:#e51d2a;color:#fff;padding:10px 15px;font-weight:700;cursor:pointer}
.song-window .song-controls button.secondary{background:#333}
@media print{.song-window{padding:0}.song-window .song-controls{display:none}}

/* Cloud authentication */
#authOverlay{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(5,7,10,.94);backdrop-filter:blur(8px);padding:20px}
#authOverlay.show{display:flex}
.auth-card{width:min(420px,100%);background:#151a20;border:1px solid #2b333d;border-radius:16px;padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.45)}
.auth-card h1{margin:0 0 7px;font-size:24px}.auth-card p{color:#8e99a6;font-size:13px;line-height:1.5;margin:0 0 22px}
.auth-card label{display:block;color:#8e99a6;font-size:11px;margin:0 0 6px}.auth-card input{width:100%;margin:0 0 13px}
.auth-card button{width:100%;margin-top:4px}.auth-status{min-height:18px;color:#ff8b8b;font-size:11px;margin-top:10px}.auth-status.ok{color:#7ee2a8}
#authUserBar{position:fixed;right:16px;top:14px;z-index:2000;display:none;align-items:center;gap:8px;background:#151a20;border:1px solid #2b333d;border-radius:999px;padding:6px 7px 6px 12px;font-size:11px;box-shadow:0 8px 30px rgba(0,0,0,.22)}
#authUserBar.show{display:flex}.user-email{color:#cbd2d9;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#authUserBar button{border:0;border-radius:999px;background:#2b333d;color:#fff;padding:6px 10px;cursor:pointer;font-size:10px}
.app.locked{pointer-events:none}
.public-mode .add,.public-mode #export{display:none}
.public-mode .public-note{display:block}
.public-note{display:none;color:var(--muted);font-size:11px;margin:8px 3px 0}
.public-view{width:100%;max-width:950px;margin:auto;padding:34px 30px;min-width:0}
.public-view h1{font-size:30px;margin:0 0 5px}.public-view .meta{color:var(--muted);font-size:12px;margin-bottom:24px}
.public-lines{width:100%;max-width:100%;min-width:0;font-family:Consolas,monospace;font-size:19px;background:#11161b;border:1px solid var(--line);border-radius:13px;padding:18px 22px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.public-line{width:max-content;min-width:100%;padding:10px 0 14px;border-bottom:1px solid #252c34;white-space:pre}.public-line:last-child{border-bottom:0}
.public-chord{color:#ff7647;font-weight:bold;white-space:pre;font-family:Consolas,monospace;min-height:22px}.public-lyric{white-space:pre;font-family:Consolas,monospace;min-height:22px}
.public-empty{color:var(--muted);padding:30px;text-align:center}
@media(max-width:750px){
  .app{width:100%;min-width:0}
  aside{width:100%;min-width:0}
  .bar{height:58px;padding:0 10px}
  .content{width:100%;min-width:0;padding:14px 10px}
  .public-view{width:100%;padding:18px 8px}
  .public-view h1{font-size:25px}
  .public-lines{padding:12px 12px;font-size:16px;border-radius:10px}
  .public-line{padding:9px 0 12px}
  #authUserBar{right:10px;top:10px}
}
</style>
</head>
<body>
<div id="authOverlay">
  <div class="auth-card">
    <h1>Xenopeltiz Song Bank</h1>
    <p>Masuk untuk mengakses lagu, lirik + chord, dan recording yang tersimpan di cloud.</p>
    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="Email" required>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn red" id="loginBtn" type="submit">Masuk</button>
      <div id="authStatus" class="auth-status">Memuat koneksi Supabase...</div>
    </form>
  </div>
</div>
<div id="authUserBar"><span class="user-email"></span><button id="logoutBtn">Masuk</button></div>

<script>
// Load Supabase client with a fallback CDN so local testing is more reliable.
function loadSupabaseClient(){
  return new Promise((resolve,reject)=>{
    if(window.supabase?.createClient){resolve();return;}
    const urls=[
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
      "https://unpkg.com/@supabase/supabase-js@2"
    ];
    let i=0;
    const next=()=>{
      if(window.supabase?.createClient){resolve();return;}
      if(i>=urls.length){reject(new Error("Library Supabase gagal dimuat. Pastikan internet aktif dan coba buka kembali halaman."));return;}
      const sc=document.createElement("script");
      sc.src=urls[i++];
      sc.onload=()=>window.supabase?.createClient?resolve():next();
      sc.onerror=next;
      document.head.appendChild(sc);
    };
    next();
  });
}

function localSongs(){
  try{
    const x=JSON.parse(localStorage.getItem(STORE));
    return Array.isArray(x)?x:[];
  }catch(e){return []}
}

async function openAudioDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open("xenopeltiz-audio-v1",1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("audio"))req.result.createObjectStore("audio")};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function getLocalAudio(id){
  try{
    const db=await openAudioDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction("audio","readonly"),req=tx.objectStore("audio").get(id);
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
  }catch(e){return null}
}
async function deleteLocalAudio(id){
  try{
    const db=await openAudioDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction("audio","readwrite");tx.objectStore("audio").delete(id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }catch(e){}
}

async function loadCloudSongs(){
  const publicMode=!currentUser;
  const [{data:rows,error:songError},{data:lineRows,error:lineError}]=await Promise.all([
    publicMode
      ? supabase.from("songs").select("id,title,artist,album,created_at,updated_at").order("album",{ascending:true}).order("created_at",{ascending:true})
      : supabase.from("songs").select("id,title,artist,album,created_at,updated_at").eq("user_id",currentUser.id).order("created_at",{ascending:true}),
    supabase.from("song_lines").select("id,song_id,line_number,content,created_at").order("line_number",{ascending:true})
  ]);
  if(songError)throw songError;
  if(lineError)throw lineError;
  const linesBySong={};
  (lineRows||[]).forEach(r=>{(linesBySong[r.song_id] ||= []).push({id:r.id,text:r.content||""})});
  if(publicMode){
    songs=(rows||[]).map(r=>({
      id:r.id,title:r.title||"Lagu Baru",artist:r.artist||"",album:r.album||"Tanpa Album",
      lyrics:linesBySong[r.id]?.length?linesBySong[r.id]:[{text:""}],recordings:[]
    }));
    return;
  }
  const {data:recRows,error:recError}=await supabase.from("recordings").select("id,song_id,name,file_path,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:true});
  if(recError)throw recError;
  const recsBySong={};
  (recRows||[]).forEach(r=>{(recsBySong[r.song_id] ||= []).push({id:r.id,name:r.name,date:r.created_at,file_path:r.file_path})});
  songs=(rows||[]).map(r=>({
    id:r.id,title:r.title||"Lagu Baru",artist:r.artist||"",album:r.album||"Tanpa Album",
    lyrics:linesBySong[r.id]?.length?linesBySong[r.id]:[{text:""}],recordings:recsBySong[r.id]||[]
  }));
}

async function migrateLocalDataIfNeeded(){
  const local=localSongs();
  if(!local.length || songs.length) return;
  const ok=confirm("Ditemukan data lagu dari versi HTML lama di browser ini. Migrasikan ke Song Bank Cloud sekarang?");
  if(!ok)return;
  const status=document.getElementById("authStatus");
  if(status)status.textContent="Memigrasikan lagu dan recording...";
  for(const old of local){
    const {data:song,error}=await supabase.from("songs").insert({
      user_id:currentUser.id,title:old.title||"Lagu Baru",artist:old.artist||"",album:old.album||"Tanpa Album"
    }).select().single();
    if(error)throw error;
    const lines=(old.lyrics?.length?old.lyrics:[{text:""}]).map((x,i)=>({song_id:song.id,line_number:i+1,content:x.text||""}));
    if(lines.length){const {error:e}=await supabase.from("song_lines").insert(lines);if(e)throw e}
    for(const oldRec of (old.recordings||[])){
      const blob=await getLocalAudio(oldRec.id);
      if(!blob)continue;
      const recId=uid();
      const ext=(blob.type||"").includes("mp4")?"m4a":(blob.type||"").includes("ogg")?"ogg":"webm";
      const path=`${currentUser.id}/${song.id}/${recId}.${ext}`;
      const {error:upErr}=await supabase.storage.from("recordings").upload(path,blob,{contentType:blob.type||"audio/webm",upsert:false});
      if(upErr)throw upErr;
      const {error:recErr}=await supabase.from("recordings").insert({id:recId,song_id:song.id,user_id:currentUser.id,name:oldRec.name||"Recording",file_path:path});
      if(recErr)throw recErr;
    }
  }
  await loadCloudSongs();
  toast("Data lama berhasil dipindahkan ke cloud ✓");
}

function showAuth(show=true){
  const el=document.getElementById("authOverlay");if(el)el.classList.toggle("show",show);
  const app=document.querySelector(".app");if(app)app.classList.toggle("locked",show);
}
function setAuthStatus(t,ok=false){const el=document.getElementById("authStatus");if(el){el.textContent=t;el.classList.toggle("ok",ok)}}

async function login(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email||!password){setAuthStatus("Masukkan email dan password.");return}
  const btn=document.getElementById("loginBtn");
  btn.disabled=true;
  setAuthStatus("Menghubungkan ke Supabase...");
  try{
    const {data,error}=await supabase.auth.signInWithPassword({email,password});
    if(error) throw error;
    setAuthStatus("Login berhasil. Memuat Song Bank...",true);
    if(data?.session) await handleSession(data.session);
  }catch(error){
    console.error("LOGIN ERROR",error);
    setAuthStatus("Login gagal: "+(error?.message||String(error)));
  }finally{
    btn.disabled=false;
  }
}
async function logout(){
  await supabase.auth.signOut();
}

document.getElementById("loginForm")?.addEventListener("submit",e=>{e.preventDefault();login()});

function renderUserBar(){
  const bar=document.getElementById("authUserBar");
  if(!bar)return;
  const btn=bar.querySelector("button");
  if(currentUser){
    bar.classList.add("show");
    bar.querySelector(".user-email").textContent=currentUser.email||"";
    if(btn){btn.textContent="Keluar";btn.onclick=logout}
  }else{
    bar.classList.add("show");
    bar.querySelector(".user-email").textContent="Mode Pengunjung";
    if(btn){btn.textContent="Masuk";btn.onclick=()=>showAuth(true)}
  }
}

async function handleSession(session){
  currentUser=session?.user||null;
  renderUserBar();
  const app=document.querySelector(".app");
  const note=document.getElementById("publicNote");
  if(!currentUser){
    showAuth(false);
    app?.classList.add("public-mode");
    if(note)note.style.display="block";
    try{
      await loadCloudSongs();
      selectedId=songs[0]?.id||null;
      renderLibrary();renderPublicView();
    }catch(e){
      console.error(e);
      songs=[];selectedId=null;renderLibrary();renderPublicView();
      const status=document.getElementById("authStatus");
      if(status)status.textContent="Gagal memuat lagu publik: "+(e.message||e);
    }
    return;
  }
  app?.classList.remove("public-mode");
  if(note)note.style.display="none";
  showAuth(false);
  setAuthStatus("Terhubung ke cloud.",true);
  try{
    await loadCloudSongs();
    await migrateLocalDataIfNeeded();
    renderLibrary();renderEditor();
  }catch(e){
    console.error(e);
    setAuthStatus("Gagal memuat data: "+(e.message||e),false);
    alert("Gagal memuat data dari Supabase. Cek koneksi dan policy database.");
  }
}

function renderLibrary(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=songs.filter(s=>(s.title+" "+s.album).toLowerCase().includes(q));
 const albums={};
 list.forEach(s=>{let a=s.album||"Tanpa Album";if(!albums[a])albums[a]=[];albums[a].push(s)});
 const root=document.getElementById("library");root.innerHTML="";
 if(!list.length){root.innerHTML='<div class="empty">Belum ada lagu.</div>';return}
 Object.keys(albums).sort().forEach(album=>{
   root.insertAdjacentHTML("beforeend",`<div class="album">${esc(album)}</div>`);
   albums[album].forEach(s=>{
     const el=document.createElement("div");el.className="song"+(s.id===selectedId?" active":"");
     el.innerHTML=`<b>${esc(s.title||"Tanpa Judul")}</b><small>${esc(s.artist||"")}</small>`;
     el.addEventListener("click",()=>selectSong(s.id));root.appendChild(el);
   });
 });
}
function selectSong(id){selectedId=id;renderLibrary();if(currentUser)renderEditor();else renderPublicView()}

async function saveCurrent(){
 const s=current();if(!s||!currentUser)return false;
 const title=document.getElementById("title")?.value.trim()||"Lagu Baru";
 const artist=document.getElementById("artist")?.value.trim()||"";
 const album=document.getElementById("album")?.value.trim()||"Tanpa Album";
 const lyrics=readRows();
 const {error:songError}=await supabase.from("songs").update({title,artist,album,updated_at:new Date().toISOString()}).eq("id",s.id).eq("user_id",currentUser.id);
 if(songError){alert("Gagal menyimpan lagu: "+songError.message);return false}
 const {error:delErr}=await supabase.from("song_lines").delete().eq("song_id",s.id);
 if(delErr){alert("Gagal memperbarui lirik: "+delErr.message);return false}
 const lineRows=(lyrics.length?lyrics:[{text:""}]).map((x,i)=>({song_id:s.id,line_number:i+1,content:x.text||""}));
 const {error:lineErr}=await supabase.from("song_lines").insert(lineRows);
 if(lineErr){alert("Gagal menyimpan lirik: "+lineErr.message);return false}
 Object.assign(s,{title,artist,album,lyrics:lineRows.map(x=>({text:x.content}))});
 renderLibrary();
 toast("Lagu tersimpan ke cloud ✓");
 return true;
}

async function deleteCurrentSong(){
 const s=current();if(!s||!currentUser)return;
 const ok=confirm(`Hapus lagu "${s.title||"Lagu Baru"}" beserta semua lirik dan recording-nya?\n\nTindakan ini tidak dapat dibatalkan.`);
 if(!ok)return;
 const btn=document.getElementById("deleteSong");
 if(btn)btn.disabled=true;
 try{
   // Ambil path recording dulu agar file Storage bisa dibersihkan setelah row lagu terhapus.
   const {data:recs,error:recLoadErr}=await supabase.from("recordings").select("file_path").eq("song_id",s.id).eq("user_id",currentUser.id);
   if(recLoadErr)throw recLoadErr;

   // Hapus parent song terlebih dahulu. song_lines dan recordings akan ikut terhapus
   // oleh ON DELETE CASCADE, sehingga tidak tersangkut RLS di tabel anak.
   const {data:deletedRows,error:songErr}=await supabase.from("songs").delete().eq("id",s.id).eq("user_id",currentUser.id).select("id");
   if(songErr)throw songErr;
   if(!deletedRows?.length)throw new Error("Lagu tidak terhapus. Periksa izin DELETE pada tabel songs di Supabase.");

   // Bersihkan file audio di Storage. Kegagalan di sini tidak membatalkan penghapusan lagu.
   if(recs?.length){
     const {error:storageErr}=await supabase.storage.from("recordings").remove(recs.map(r=>r.file_path));
     if(storageErr)console.warn("File recording gagal dibersihkan:",storageErr);
   }

   const idx=songs.findIndex(x=>x.id===s.id);
   if(idx>=0)songs.splice(idx,1);
   selectedId=songs[0]?.id||null;
   renderLibrary();renderEditor();
   toast("Lagu berhasil dihapus ✓");
 }catch(e){
   console.error(e);
   alert("Gagal menghapus lagu: "+(e?.message||e));
 }finally{
   if(btn)btn.disabled=false;
 }
}

function renderRows(){
 const s=current(),root=document.getElementById("rows");root.innerHTML="";
 const lines=s.lyrics?.length?s.lyrics:[{text:""}];
 lines.forEach((x,i)=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<div class="num">${i+1}</div><input class="line-input" placeholder="[G]I have [Em]passed many [C]days" value="${esc(x.text||"")}"><button class="btn del">×</button>`;d.querySelector(".del").onclick=()=>{d.remove();renumber();renderPreview()};d.querySelector(".line-input").oninput=renderPreview;root.appendChild(d)});
}
function renumber(){document.querySelectorAll(".num").forEach((x,i)=>x.textContent=i+1)}
function readRows(){return [...document.querySelectorAll("#rows .row")].map(r=>({text:r.querySelector(".line-input").value}))}
function parseChordLine(text){
 const chordRe=/\[([^\]]+)\]/g;let lyric="",chordLine="",last=0,m;
 while((m=chordRe.exec(text))){const before=text.slice(last,m.index);lyric+=before;if(chordLine.length<lyric.length)chordLine+=" ".repeat(lyric.length-chordLine.length);chordLine+=m[1].trim();last=chordRe.lastIndex}
 const tail=text.slice(last);lyric+=tail;if(chordLine.length<lyric.length)chordLine+=" ".repeat(lyric.length-chordLine.length);return {chordLine,lyric};
}
function renderPreview(){const r=document.getElementById("preview");if(!r)return;r.innerHTML=readRows().map(x=>{const p=parseChordLine(x.text||"");return `<div class="lyric"><div class="chord">${esc(p.chordLine||" ")}</div><div class="words">${esc(p.lyric||" ")}</div></div>`}).join("")}
function addEmptyRow(){const root=document.getElementById("rows"),i=root.children.length;const d=document.createElement("div");d.className="row";d.innerHTML=`<div class="num">${i+1}</div><input class="line-input" placeholder="[G]I have [Em]passed many [C]days" value=""><button class="btn del">×</button>`;d.querySelector(".del").onclick=()=>{d.remove();renumber();renderPreview()};d.querySelector(".line-input").oninput=renderPreview;root.appendChild(d);d.querySelector(".line-input").focus()}

async function startRecording(){
 try{
   if(!currentUser){alert("Silakan login terlebih dahulu.");return}
   const stream=await navigator.mediaDevices.getUserMedia({audio:true});
   chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
   recorder.onstop=async()=>{
     stream.getTracks().forEach(t=>t.stop());
     const blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"});
     const s=current();if(!s)return;
     const recId=uid();const ext=(blob.type||"").includes("mp4")?"m4a":(blob.type||"").includes("ogg")?"ogg":"webm";
     const path=`${currentUser.id}/${s.id}/${recId}.${ext}`;
     document.getElementById("recordStatus").textContent="Mengunggah recording...";
     const {error:upErr}=await supabase.storage.from("recordings").upload(path,blob,{contentType:blob.type||"audio/webm",upsert:false});
     if(upErr){document.getElementById("recordStatus").textContent="Upload gagal.";alert("Recording gagal diupload: "+upErr.message);return}
     const name="Recording "+new Date().toLocaleString("id-ID");
     const {data:rec,error:recErr}=await supabase.from("recordings").insert({id:recId,song_id:s.id,user_id:currentUser.id,name,file_path:path}).select().single();
     if(recErr){await supabase.storage.from("recordings").remove([path]);document.getElementById("recordStatus").textContent="Gagal menyimpan recording.";alert("Metadata recording gagal disimpan: "+recErr.message);return}
     s.recordings=s.recordings||[];s.recordings.push({id:rec.id,name:rec.name,date:rec.created_at,file_path:rec.file_path});
     await renderRecordings();document.getElementById("recordStatus").textContent="Recording tersimpan ✓";toast("Recording tersimpan ke cloud ✓");
   };
   recorder.start();document.getElementById("record").disabled=true;document.getElementById("stop").disabled=false;document.getElementById("recordStatus").textContent="● Sedang merekam...";
 }catch(e){console.error(e);alert("Microphone tidak bisa digunakan. Izinkan akses microphone di browser HTTPS.")}
}
function stopRecording(){if(recorder&&recorder.state!=="inactive")recorder.stop();document.getElementById("record").disabled=false;document.getElementById("stop").disabled=true}

async function renderRecordings(){
 const root=document.getElementById("recordings"),s=current(),list=s?.recordings||[];if(!root)return;root.innerHTML="";
 if(!list.length){root.innerHTML='<div class="empty">Belum ada recording.</div>';return}
 for(let i=0;i<list.length;i++){
   const r=list[i],d=document.createElement("div");d.className="rec";d.innerHTML=`<div><b>${esc(r.name)}</b><small>${new Date(r.date).toLocaleString("id-ID")}</small></div><div class="audioBox"></div>`;
   const box=d.querySelector(".audioBox"),audio=document.createElement("audio");audio.controls=true;
   try{const {data,error}=await supabase.storage.from("recordings").createSignedUrl(r.file_path,3600);if(!error&&data?.signedUrl)audio.src=data.signedUrl}catch(e){console.error(e)}
   const del=document.createElement("button");del.className="btn";del.textContent="Hapus";
   del.onclick=async()=>{if(!confirm("Hapus recording ini?"))return;const {error:se}=await supabase.storage.from("recordings").remove([r.file_path]);if(se){alert("Gagal menghapus file: "+se.message);return}const {error:de}=await supabase.from("recordings").delete().eq("id",r.id).eq("user_id",currentUser.id);if(de){alert("File terhapus tetapi metadata gagal dihapus: "+de.message);return}s.recordings.splice(i,1);renderRecordings();toast("Recording dihapus")};
   box.append(audio,del);root.appendChild(d);
 }
}

 let src=document.documentElement.outerHTML;
 src=src.replace(/const songsDefault=.*?;\nlet songs=.*?;\n/s,`const songsDefault=[];\nlet songs=JSON.parse('${data}');\n`);
 const blob=new Blob(["<!doctype html>\n"+src],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Xenopeltiz_Song_Bank_Backup.html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Backup HTML berhasil dibuat ✓");
}

 <script>
 let scrolling=false,timer=null,scrollSpeed=5;
 function setSpeed(v){
   scrollSpeed=Number(v)||5;
   if(scrolling){startScrollTimer();}
 }
 function startScrollTimer(){
   if(timer)clearInterval(timer);
   // 1 = very slow, 10 = very fast. Interval is inverted so higher means faster.
   const interval=Math.max(8,118-(scrollSpeed*11));
   timer=setInterval(()=>{
     window.scrollBy(0,1);
     if(window.innerHeight+window.scrollY>=document.body.scrollHeight-2)toggleScroll();
   },interval);
 }
 function toggleScroll(){
   scrolling=!scrolling;
   document.getElementById("scrollBtn").textContent=scrolling?"⏸ Stop Scroll":"▶ Auto Scroll";
   if(scrolling)startScrollTimer();
   else if(timer){clearInterval(timer);timer=null}
 }
 <\/script></body></html>`;
}

function exportHTML(){
 // Export only the song database. Recording remains local to the browser.
 const data=JSON.stringify(songs.map(s=>({...s,recordings:[]}))).replace(/</g,"\\u003c");
 let src=document.documentElement.outerHTML;
 src=src.replace(/const songsDefault=.*?;\nlet songs=/s,`const songsDefault=[];\nlet songs=JSON.parse('${data}');\n`);
 // Make exported file start with its embedded songs rather than an old browser database.
 src=src.replace(/function loadSongs\(\)\{.*?\}/s,`function loadSongs(){return Array.isArray(songs)?songs:[]}`);
 const blob=new Blob(["<!doctype html>\\n"+src],{type:"text/html;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Xenopeltiz_Song_Bank.html";a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("HTML berhasil diexport ✓");
}
document.getElementById("export").onclick=exportHTML;

renderLibrary();renderEditor();
